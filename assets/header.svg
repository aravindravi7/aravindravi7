<svg xmlns="http://www.w3.org/2000/svg" width="860" height="392" viewBox="0 0 860 392" role="img" aria-labelledby="t d">
<title id="t">aravind@github: ~</title>
<desc id="d">A terminal session. whoami prints Aravind Ravi, Technical Product Manager, Boston, MA. cat now.txt prints: finishing an MS in Information Systems at Northeastern, December 2026, and shipping AI side builds, CORTEX and SignalScout. cat motto.txt prints: thinking-native, with AI as the engine. Status: open to full-time PM roles.</desc>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
.p{fill:#00F5D4}.t{fill:#EAEAEA}.m{fill:#8B93A7}.cv{fill:#0B0F1A}
.s{animation:show .01s linear both}
@keyframes show{from{opacity:0}to{opacity:1}}
.c1{animation:ty1 .6s steps(6) .5s both}
.c3{animation:ty3 .9s steps(11) 1.9s both}
.c5{animation:ty5 1s steps(13) 3.6s both}
@keyframes ty1{from{transform:translateX(0)}to{transform:translateX(66px)}}
@keyframes ty3{from{transform:translateX(0)}to{transform:translateX(116px)}}
@keyframes ty5{from{transform:translateX(0)}to{transform:translateX(134px)}}
.cur{animation:show .01s linear 5.2s both,blink 1.1s steps(1) 5.2s infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><clipPath id="card"><rect width="860" height="392" rx="14"/></clipPath></defs>
