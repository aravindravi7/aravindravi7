<title id="t">SignalScout</title>
<desc id="d">SignalScout, January to April 2026: multi-evaluator AI triage for research overload. Orthogonal judgment axes raised mixed verdicts from 13 percent to 65 percent. 3 evaluators, Thompson Sampling, plus 308 versus minus 136 against a random baseline. Python, Streamlit, OpenAI API, SQLite. Live app.</desc>
