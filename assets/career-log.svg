<title id="t">Career as a git log</title>
<desc id="d">git log --graph --oneline, newest first. feat: open to full-time PM roles · Boston, MA (now). feat: priced a $220M data-center bid · LG ES Vertech (2025). merge: MS Information Systems · Northeastern (2024–26). revert: AI visual content · not enterprise-grade (2024). feat: zero to MVP in 6 months, 20+ integrations · Unilytics (2024). feat: data, design + AI for 120+ NGOs · Tech4Dev (2023). feat: India’s first NFT e-commerce, $1.5M+ Q1 · KoineArth (2021). init: co-founded, bootstrapped to $250K+ · UnivSense (2020). perf: disbursements 10x, 4–5h → under 2h · Propelld (2019). fix: doctor churn, retention +15% · HealthPlix (2018). first commit: HV/MV power electronics · Brown Electrical (2018). The first commit and HEAD are both on the energy branch.</desc>
